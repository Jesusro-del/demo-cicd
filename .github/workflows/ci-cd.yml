# Pipeline CI/CD de demo-cicd. Semana 06, IF-1116.
#
# Un job por etapa, encadenados con needs. Si uno falla, los siguientes no corren.
# Las acciones van fijadas por SHA (el tag queda como comentario): un tag se puede mover, un SHA no.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto el token solo lee. Cada job pide lo que necesita de más.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

  # Sin needs: corre en paralelo con lint.
  sast:
    name: 2. SAST (Semgrep) y secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # Gitleaks revisa todo el historial, no solo el último commit
      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --error --metrics=off /src
      - name: Gitleaks, secretos en el historial de Git
        run: >
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1
          -c "git config --global --add safe.directory /repo && gitleaks git /repo --redact -v --exit-code 1"

  test-unit:
    name: 3. Pruebas unitarias y del sitio
    needs: lint                 # lo barato primero: si el lint falla, no se gastan minutos en pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run test:unit
      - run: npm run test:site

  test-integration:
    name: 4. Pruebas de integración (Compose)
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Levantar la aplicación
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait
      - run: npm run test:integration
      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
