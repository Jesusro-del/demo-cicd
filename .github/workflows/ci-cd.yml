# Pipeline CI/CD de demo-cicd. Semana 06, IF-1116.
#
# Un job por etapa, encadenados con needs. Si uno falla, los siguientes no corren.
# lint, sast, test-unit y test-integration corren en paralelo y se juntan en package (B6).
# Las acciones van fijadas por SHA (el tag queda como comentario): un tag se puede mover, un SHA no.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto el token solo lee. Cada job pide lo que necesita de más.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

  # Sin needs: corre en paralelo con lint.
  sast:
    name: 2. SAST (Semgrep) y secretos (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # TruffleHog revisa todo el historial, no solo el último commit
      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --error --metrics=off /src
      # TruffleHog en vez de Gitleaks (B2).
      # --fail: sale con error si encuentra algo. --results: también los no verificados, porque un token
      #   de un servicio sin API de verificación también es un secreto. --no-update: la versión fija manda.
      # --user: el repo montado es del usuario del runner; así git no se niega a leerlo (dubious ownership).
      # TruffleHog no tiene --redact: jq deja solo dónde está y de qué tipo es, nunca el valor.
      #   El log de Actions es público.
      # shell: bash es obligatorio aquí: solo así GitHub usa -o pipefail. Sin él (bash -e a secas), si
      #   TruffleHog encuentra algo y falla, jq termina bien y el paso quedaría en verde: el escáner apagado.
      # --branch con el commit del run: todo el historial que lleva a este commit, pero no las otras ramas.
      #   Con fetch-depth: 0 el checkout trae todas, y un secreto en una rama ajena bloqueaba todos los PR.
      - name: TruffleHog, secretos en el historial de Git
        if: ${{ !cancelled() }}         # corre aunque Semgrep haya fallado: los dos escáneres informan siempre
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.3 \
            git file:///repo --branch "$(git rev-parse HEAD)" \
            --fail --no-update --json --results=verified,unverified,unknown \
            | jq -c '{detector: .DetectorName, verificado: .Verified, archivo: .SourceMetadata.Data.Git.file,
                      linea: .SourceMetadata.Data.Git.line, commit: .SourceMetadata.Data.Git.commit}'

  test-unit:
    name: 3. Pruebas unitarias y del sitio
    # B6: sin needs, corre en paralelo con lint y sast. Antes esperaba al lint ("lo barato primero"):
    # ahorraba minutos si el lint fallaba, pero alargaba el camino de todos los runs que pasan.
    # La compuerta no se pierde: package necesita lint, sast y las dos pruebas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      # Además de la salida normal, Vitest deja un JSON para el resumen del run.
      - run: npm run test:unit -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/unit.json"
      - run: npm run test:site -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/site.json"
      - name: Resumen de las pruebas
        if: ${{ !cancelled() }}         # también cuando fallan: es cuando más importa ver cuáles
        run: |
          node scripts/resumen.mjs pruebas "$RUNNER_TEMP/unit.json" "Pruebas unitarias de la API"
          node scripts/resumen.mjs pruebas "$RUNNER_TEMP/site.json" "Pruebas del sitio"

  test-integration:
    name: 4. Pruebas de integración (Compose)
    # B6: tampoco espera a las unitarias; es el job más largo de esta primera fase y marca su duración.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Levantar la aplicación
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/integracion.json"
      - name: Resumen de las pruebas
        if: ${{ !cancelled() }}
        run: node scripts/resumen.mjs pruebas "$RUNNER_TEMP/integracion.json" "Pruebas de integración (Compose)"
      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v

  package:
    name: 5. Empaquetar y publicar (${{ matrix.servicio }})
    needs: [lint, sast, test-unit, test-integration]   # aquí se juntan las cuatro: nada se publica sin todas en verde
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # solo este job puede publicar en GHCR
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          # B6: solo amd64. DEV (kind en el runner) y STAGING (Rancher Desktop en mi laptop Windows) son amd64;
          # arm64 obligaba a emular con QEMU y costaba unos 15 s por imagen. Para una Mac con chip Apple
          # habría que volver a agregar linux/arm64 y docker/setup-qemu-action.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  security:
    name: 6. Escaneo de imagen (${{ matrix.servicio }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false              # cada imagen reporta sus hallazgos; si una falla, security sigue en rojo
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      # B6: la base de vulnerabilidades de Grype pesa cientos de MB y descargarla era el 90 % del job.
      # Se guarda en caché con una clave por día: el primer escaneo del día la baja, los demás la reusan.
      # Grype igual comprueba si hay una más nueva y nunca usa una de más de 5 días.
      - name: Fecha para la clave de la caché
        id: fecha
        run: echo "hoy=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de Grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .grype-db
          key: grype-db-${{ steps.fecha.outputs.hoy }}
          restore-keys: grype-db-
      # Grype en vez de Trivy (B2). Mismo criterio: HIGH y CRITICAL frenan, solo las que tienen parche.
      # --fail-on high: sale con error si hay alguna de severidad high o mayor.
      # --only-fixed: sin parche no hay acción posible hoy (lo que Trivy llamaba ignore-unfixed).
      # .grype.yaml: las aceptadas, una por una, acotadas al binario donde están.
      # Las credenciales entran como variables del contenedor (-e sin valor), nunca en la línea de comandos.
      - name: Grype, vulnerabilidades de la imagen
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          docker run --rm -v "$PWD:/trabajo" -w /trabajo
          -e GRYPE_REGISTRY_AUTH_AUTHORITY -e GRYPE_REGISTRY_AUTH_USERNAME -e GRYPE_REGISTRY_AUTH_PASSWORD
          -e GRYPE_DB_CACHE_DIR=/trabajo/.grype-db
          anchore/grype:v0.121.0
          "registry:$IMAGEN:sha-${{ github.sha }}"
          --fail-on high --only-fixed --config .grype.yaml
          -o table -o json=grype.json
      - name: Resumen del escaneo
        if: ${{ !cancelled() }}
        run: node scripts/resumen.mjs grype grype.json "demo-cicd-${{ matrix.servicio }}"
      # Grype corre como root dentro del contenedor: los archivos de la base quedan de root.
      # Se devuelven al usuario del runner para que actions/cache pueda guardarlos al terminar el job.
      - name: Permisos de la base para la caché
        if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" .grype-db || true

  deploy-dev:
    name: 7. Deploy DEV (efímero) y smoke
    needs: security
    if: github.event_name != 'pull_request'   # un PR se prueba y se empaqueta, pero nunca despliega
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: echo "PREFIJO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd" >> "$GITHUB_ENV"
      - name: Crear el clúster (kind)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: dev
      - name: Namespace y secretos
        run: |
          kubectl create namespace demo-dev
          kubectl -n demo-dev create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl -n demo-dev create secret generic db-credenciales --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
      - name: Desplegar
        run: scripts/desplegar.sh k8s/overlays/dev "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-dev rollout status deploy/db  --timeout=180s
          kubectl -n demo-dev rollout status deploy/api --timeout=180s
          kubectl -n demo-dev rollout status deploy/web --timeout=180s
      - name: Smoke test y pruebas de integración contra DEV
        run: |
          kubectl -n demo-dev port-forward svc/web 8080:80 &
          sleep 3
          bash scripts/smoke.sh http://localhost:8080
          APP_URL=http://localhost:8080 npm run test:integration -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/integracion-dev.json"
      - name: Resumen de DEV
        if: ${{ !cancelled() }}
        run: |
          echo "### DEV (kind, efímero): imágenes \`sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          node scripts/resumen.mjs pruebas "$RUNNER_TEMP/integracion-dev.json" "Pruebas de integración contra DEV"
      - name: Diagnóstico (solo si algo falló)
        if: failure()
        run: |
          kubectl -n demo-dev get all
          kubectl -n demo-dev describe pods
          kubectl -n demo-dev logs -l app=api --tail=50 || true
          kubectl -n demo-dev logs -l app=db  --tail=50 || true

  deploy-staging:
    name: 8. Deploy STAGING (con aprobación)
    needs: deploy-dev
    # Solo desde main. Con la condición de la guía (!= pull_request), un workflow_dispatch desde cualquier rama
    # llegaba hasta la aprobación de STAGING: pasó tres veces en el laboratorio.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Un solo despliegue a STAGING a la vez. Si llega uno nuevo mientras otro espera la aprobación, el que esperaba
    # se cancela: aprobarlo después desplegaría una versión vieja encima de la nueva (pasó con el run del PR #19).
    # cancel-in-progress: false para no cortar un despliegue que ya está aplicando cambios en el clúster.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: self-hosted                      # el runner de mi laptop, donde kubectl apunta a Rancher Desktop
    environment:
      name: staging                           # con Required reviewers: el job espera la aprobación
      url: http://localhost:30080
    defaults:
      run:
        # Git Bash con su ruta completa: en Windows, "bash" a secas puede ser el de WSL, que no ve el kubectl
        # de Rancher Desktop. Mismos flags que GitHub usa para shell: bash.
        # PROGRA~1 es el nombre corto (8.3) de "Program Files": el runner corta el shell en el primer espacio
        # y no entiende comillas, así que la ruta no puede llevar espacios.
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "PREFIJO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd" >> "$GITHUB_ENV"
      - name: Desplegar la misma imagen que pasó por DEV
        run: scripts/desplegar.sh k8s/overlays/staging "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-staging rollout status deploy/db  --timeout=180s
          kubectl -n demo-staging rollout status deploy/api --timeout=180s
          kubectl -n demo-staging rollout status deploy/web --timeout=180s
      # rollout status termina cuando los pods nuevos están listos, pero los viejos todavía se están borrando
      # y el Service puede enviarles alguna conexión. El smoke tiene que probar el estado final, no la transición.
      - name: Esperar a que se borren los pods viejos
        run: |
          for i in $(seq 1 45); do
            viejos=$(kubectl -n demo-staging get pods -o jsonpath='{.items[?(@.metadata.deletionTimestamp)].metadata.name}')
            [ -z "$viejos" ] && echo "Sin pods terminando" && exit 0
            echo "Terminando: $viejos"
            sleep 2
          done
          echo "Pasaron 90 s y siguen pods terminando"
          kubectl -n demo-staging get pods
          exit 1
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:30080 | tee smoke.txt
      - name: Resumen de STAGING
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### STAGING (Rancher Desktop): imágenes \`sha-${{ github.sha }}\`"
            echo
            echo '```'
            cat smoke.txt 2>/dev/null || echo "El smoke no llegó a correr."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
