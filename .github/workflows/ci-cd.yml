# Pipeline CI/CD de demo-cicd. Semana 06, IF-1116.
#
# Un job por etapa, encadenados con needs. Si uno falla, los siguientes no corren.
# Las acciones van fijadas por SHA (el tag queda como comentario): un tag se puede mover, un SHA no.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto el token solo lee. Cada job pide lo que necesita de más.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning
