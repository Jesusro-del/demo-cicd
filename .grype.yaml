# Vulnerabilidades aceptadas por Grype, con el porqué. Cada entrada es una decisión documentada, no un atajo.
# Antes vivían en .trivyignore (Trivy se cambió por Grype en el B2 del LAB-04).
#
# Todas están en gosu (/usr/local/bin/gosu en demo-cicd-db), el binario Go que trae la imagen oficial
# postgres:16-alpine. Son de la librería estándar de Go con la que se compiló gosu.
#
# Por qué no son explotables aquí: el entrypoint de Postgres ejecuta gosu una sola vez, al arrancar, para hacer
# setuid/setgid al usuario postgres y reemplazarse con exec por el proceso de Postgres. gosu no abre sockets ni
# escucha en ningún puerto, no hace peticiones HTTP, no parsea URLs, correos, MIME, XML ni plantillas HTML, no
# valida certificados ni usa TLS, y no recibe datos de la red: sus únicos argumentos los escribe el entrypoint.
# El código vulnerable está enlazado en el binario pero nunca se ejecuta.
#
# Por qué no se corrigen: gosu es un binario estático de la imagen oficial; apk upgrade no lo toca. La
# corrección es que la imagen oficial lo recompile con un Go nuevo. Aceptadas el 09/10 (CVE-2025-68121) y el
# 27/10/2026 (las demás). Se revisan cuando Dependabot proponga una imagen de Postgres nueva.
#
# A diferencia de .trivyignore, cada regla está acotada al binario: si el mismo CVE apareciera en otro paquete,
# Grype lo frenaría. Grype no tiene fecha de caducidad para las reglas (Trivy sí: exp:).
ignore:
  # crypto/tls (validación de certificados al reanudar sesiones TLS)
  - vulnerability: CVE-2025-68121
    package:
      location: /usr/local/bin/gosu
  # net/url
  - vulnerability: CVE-2025-61726
    package:
      location: /usr/local/bin/gosu
  # crypto/x509
  - vulnerability: CVE-2025-61729
    package:
      location: /usr/local/bin/gosu
