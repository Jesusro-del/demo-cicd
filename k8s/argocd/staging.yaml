# Reto 4: GitOps. Argo CD (dentro del clúster) mira k8s/overlays/staging en la rama gitops/staging y deja
# STAGING igual a Git.
# El pipeline ya no hace kubectl apply: con la aprobación, publica esa rama (el commit de main con el tag nuevo).
#
# Se aplica una sola vez, a mano (ver README.md de esta carpeta):
#   kubectl apply -n argocd -f k8s/argocd/staging.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jesusro-del/demo-cicd.git   # público: Argo lo lee sin credenciales
    targetRevision: gitops/staging         # la publica deploy-staging; main no se toca (ver ci-cd.yml)
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc                  # el mismo clúster donde corre Argo CD
    namespace: demo-staging
  syncPolicy:
    automated:
      prune: true      # lo que se borra de Git se borra del clúster
      selfHeal: true   # si alguien cambia algo a mano en el clúster, Argo lo devuelve a lo que dice Git
    syncOptions:
      - CreateNamespace=false   # demo-staging ya existe, con el Secret db-credenciales creado a mano
