# STAGING: un ambiente persistente, con datos similares a producción, al que solo se llega con aprobación.
# web se expone por NodePort 30080: en Rancher Desktop queda en http://localhost:30080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging
resources:
  - ../../base
labels:
  - pairs:
      ambiente: staging
    includeSelectors: false
patches:
  - path: web-nodeport.yaml
  - path: api-replicas.yaml

# Reto 4 (GitOps): qué imagen corre en STAGING está escrito aquí, en Git. Argo CD lo lee y lo aplica.
# El job deploy-staging solo cambia estos tres newTag (con sed) y hace commit a main; ya no toca el clúster.
images:
  - name: demo-cicd-web
    newName: ghcr.io/jesusro-del/demo-cicd-web
    newTag: sha-8228b6dfd346627ee1f348b10d7aa18639481538
  - name: demo-cicd-api
    newName: ghcr.io/jesusro-del/demo-cicd-api
    newTag: sha-8228b6dfd346627ee1f348b10d7aa18639481538
  - name: demo-cicd-db
    newName: ghcr.io/jesusro-del/demo-cicd-db
    newTag: sha-8228b6dfd346627ee1f348b10d7aa18639481538
