# Prometheus: descubre los pods de demo-staging y evalúa la alerta de k8s/alertas.yml.
# Para descubrir pods necesita leerlos: un ClusterRole de solo lectura sobre pods, y nada más.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-leer-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-leer-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-leer-pods
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observabilidad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534          # nobody, el usuario de la imagen oficial
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0   # la misma versión fija que compose.yaml
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d   # las métricas viven en un emptyDir: un laboratorio, no un histórico
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: datos
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus            # el datasource de Grafana apunta a http://prometheus:9090
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
