# nginx sirve la página y reenvía /api/ al backend.
# Escucha en 8080 porque la imagen corre sin root (nginx-unprivileged), y sin root no se puede usar el puerto 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (Reto 1: las siete alertas del primer escaneo de OWASP ZAP).
    # Van en el server, así que las heredan todas las location (ninguna define add_header propio).
    # always: también en las respuestas de error (404, 502...), no solo en las 200.
    server_tokens off;                                          # sin versión de nginx en "Server" ni en las páginas de error (10036, 10009)
    add_header X-Content-Type-Options "nosniff" always;         # el navegador no adivina el tipo de un archivo (10021)
    add_header X-Frame-Options "DENY" always;                   # nadie puede meter la página en un iframe: clickjacking (10020)
    # Solo recursos de este mismo origen. La página no tiene scripts ni estilos en línea, así que no hace falta 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;  # (10038, 10020)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;  # la página no usa ninguna (10063)
    add_header Cross-Origin-Resource-Policy "same-origin" always;  # otros sitios no pueden incrustar nuestros recursos (90004)

    # La API vive en otro contenedor. El navegador nunca la ve directamente.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;   # Express anuncia que es Express: al navegador no le sirve y a un atacante sí
        proxy_read_timeout 5s;
        # Por defecto nginx espera 60 s a conectar. Si la API no acepta la conexión en 3 s (por ejemplo, un pod
        # que se está apagando durante un despliegue), es mejor responder enseguida que dejar al usuario colgado.
        proxy_connect_timeout 3s;
    }

    # Las métricas de la API son para Prometheus, no para Internet.
    location /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
