# Reglas de OWASP ZAP para el baseline scan contra DEV (Reto 1 del LAB-04).
# Formato de ZAP: <id de la regla><TAB><FAIL|WARN|IGNORE|INFO><TAB>(nombre). Las líneas con # son comentarios.
#
# Cualquier regla que no esté en este archivo queda en WARN, y un WARN pone el job en rojo (el pipeline
# no corre con -I). Aquí se listan solo las decisiones explícitas, cada una con su porqué.
#
# FAIL: las siete alertas del primer escaneo (run 40728141052), que se corrigieron con cabeceras en web/nginx.conf.
# Están en FAIL y no en WARN para que una regresión (alguien quita una cabecera) se lea como lo que es: algo que
# ya estaba arreglado y se rompió.
#
# IGNORE: ninguna por ahora. Si una alerta se acepta, va aquí en IGNORE, con la fecha y el porqué en el comentario
# de la línea anterior, igual que .grype.yaml.

# server_tokens off: nginx ya no muestra su versión en las páginas de error.
10009	FAIL	(In Page Banner Information Leak)
# X-Frame-Options: DENY y frame-ancestors 'none' en la CSP.
10020	FAIL	(Missing Anti-clickjacking Header)
# X-Content-Type-Options: nosniff.
10021	FAIL	(X-Content-Type-Options Header Missing)
# server_tokens off: el encabezado Server ya no lleva la versión.
10036	FAIL	(Server Leaks Version Information via "Server" HTTP Response Header Field)
# Content-Security-Policy con default-src 'self'.
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
# Permissions-Policy: cámara, micrófono, geolocalización y pagos desactivados.
10063	FAIL	(Permissions Policy Header Not Set)
# Cross-Origin-Resource-Policy, -Embedder-Policy y -Opener-Policy.
90004	FAIL	(Insufficient Site Isolation Against Spectre Vulnerability)
